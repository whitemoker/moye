name: Release Windows portable app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Check version tag
        run: |
          $taskVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -cne "v$taskVersion") {
            throw "Release tag must match package.json version: v$taskVersion"
          }
          "MOYE_VERSION=$taskVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Windows app
        run: npm run package

      - name: Prepare portable ZIP and checksums
        run: |
          $taskPackage = Join-Path $PWD 'release/Moye-win32-x64'
          foreach ($taskRequired in @('Moye.exe', 'resources/app.asar', 'resources/LICENSE', 'resources/THIRD-PARTY-NOTICES.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $taskPackage $taskRequired) -PathType Leaf)) {
              throw "Release package is missing $taskRequired"
            }
          }
          $taskSourceLicense = (Get-FileHash -LiteralPath 'LICENSE' -Algorithm SHA256).Hash
          $taskPackageLicense = (Get-FileHash -LiteralPath (Join-Path $taskPackage 'resources/LICENSE') -Algorithm SHA256).Hash
          if ($taskSourceLicense -ne $taskPackageLicense) { throw 'Packaged LICENSE differs from source' }
          $taskZipName = "Moye-$env:MOYE_VERSION-Windows-x64.zip"
          $taskZip = Join-Path $PWD "release/$taskZipName"
          Compress-Archive -LiteralPath $taskPackage -DestinationPath $taskZip -CompressionLevel Optimal
          $taskHash = (Get-FileHash -LiteralPath $taskZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$taskHash  $taskZipName" | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding ascii
          @"
          # 墨页 $env:MOYE_VERSION

          Windows x64 便携版，无需安装。

          ## 下载后怎么用

          1. 下载下面 Assets 中的 Moye-$env:MOYE_VERSION-Windows-x64.zip。
          2. 右键压缩包，选择“全部解压”。
          3. 打开解压后的 Moye-win32-x64 文件夹，双击 Moye.exe。
          4. 保留整个解压文件夹；程序启动不需要 Node.js。

          GitHub 自动附带的 Source code 压缩包是源码，普通使用请下载 Windows-x64.zip。

          ## 开始写作

          - Ctrl+N 新建，Ctrl+O 打开，Ctrl+S 保存。
          - Ctrl+/ 切换源码与即时编辑；选中文字后右键可调整格式。
          - 右上角三个点调整主题、字号和文稿宽度。
          - “帮助 → 快捷键与使用说明”查看完整操作。
          - “文件”菜单可导出 PDF / HTML。

          使用说明与问题反馈：https://github.com/whitemoker/moye

          本软件采用 Apache License 2.0 + Commons Clause 1.0，完整条款与第三方许可说明随程序附带。
          SHA256SUMS.txt 提供此下载包的 SHA-256 校验值。
          "@ | Set-Content -LiteralPath 'release/RELEASE-NOTES.md' -Encoding utf8

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "release/Moye-$env:MOYE_VERSION-Windows-x64.zip" 'release/SHA256SUMS.txt' --verify-tag --title "墨页 $env:MOYE_VERSION" --notes-file 'release/RELEASE-NOTES.md'
